# Configuracion local de AIDE para el TP2.
database_in=file:/srv/tp2/aide/aide.db
database_out=file:/srv/tp2/aide/aide.db.new

# Mostrar en stdout los atributos que cambiaron.
report_level=changed_attributes
report_url=stdout

# Permisos, tipo, inode, enlaces, propietario, grupo,
# tamanio, tiempos de modificacion/cambio y SHA-256.
TP2_NORMAL = p+ftype+i+n+u+g+s+m+c+sha256

# Observar solo el directorio de datos del laboratorio.
/srv/tp2/datos TP2_NORMAL
